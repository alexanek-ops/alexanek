name: Build Windows VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBB_COPY_AFTER_BUILD=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target BytebeatSynth_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "build/BytebeatSynth_artefacts/Release/VST3/Bytebeat Synth.vst3"
          if (!(Test-Path $plugin)) { throw "VST3 bundle not found: $plugin" }
          Compress-Archive -Path $plugin -DestinationPath "BytebeatSynth-Windows-VST3.zip" -Force

      - name: Upload ready-to-install plugin
        uses: actions/upload-artifact@v4
        with:
          name: BytebeatSynth-Windows-VST3
          path: BytebeatSynth-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
